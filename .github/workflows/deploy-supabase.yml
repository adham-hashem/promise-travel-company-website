name: Automatic Supabase Database Sync & CI Checks

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Verify Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Test Production Build
        run: npm run build

  deploy-supabase:
    name: Auto Sync Supabase Migrations
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 2.116.0

      - name: Push Database Migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_PROJECT_ID or SUPABASE_DB_PASSWORD is missing."
            exit 1
          fi

          DB_PASSWORD_ENCODED=$(python -c 'import os; from urllib.parse import quote; print(quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')

          echo "Pushing migrations directly to Supabase database..."
          supabase db push --db-url "postgresql://postgres:${DB_PASSWORD_ENCODED}@db.${SUPABASE_PROJECT_ID}.supabase.co:5432/postgres"
